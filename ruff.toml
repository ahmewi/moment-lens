# Lint configuration for the whole repository (api/ and scripts/): `ruff check api scripts`, from any directory.
line-length = 140
target-version = "py311"
# The application package is api/app; the scripts import it by putting api/ on sys.path.
src = ["api"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# One-line guard clauses ("if x: return y") are used on purpose in a few helpers.
ignore = ["E701"]
