[project]
name = "momentlens-api"
version = "0.1.0"
description = "MomentLens API: natural-language moment search over indexed videos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.32.0,<1",
  "python-multipart>=0.0.12,<1",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "azure-identity>=1.19.0,<2",
  "azure-storage-blob>=12.23.0,<13",
  "azure-data-tables>=12.5.0,<13",
  "azure-search-documents>=11.6.0,<12",
  "openai>=1.57.0,<4",
  "httpx>=0.27.0,<1",
  "tenacity>=9.0.0,<10",
  "python-dotenv>=1.0.1,<2",
  "azure-monitor-opentelemetry>=1.6.0,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers", "app.pipelines"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
